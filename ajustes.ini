# Lo que se puede cambiar del montaje.
#
# No hace falta tocar nada para usar el programa: todo lo de aca ya
# viene puesto en estos valores. Lo que se borre vuelve al de fabrica,
# y un valor que no sea un numero se avisa y se ignora, asi que no hay
# forma de romper el programa editando este archivo.

[audio]
# A cuanto se nivela la voz, en LUFS. -14 es lo que usan Instagram,
# YouTube y Spotify: entregando mas fuerte lo bajan ellos, y entregando
# mas bajo lo suben con todo el ruido de fondo adentro.
objetivo_lufs = -14.0

# Pico real maximo, en dBTP. -1 deja margen para que la compresion de
# las redes no distorsione en los golpes de voz.
pico_maximo_dbtp = -1.0

# Cuanto rango dinamico se permite, en LU.
rango_lu = 11.0

[silencios]
# A partir de cuantos segundos sin voz se corta. Por debajo de medio
# segundo se cortan las pausas naturales del habla y suena atropellado.
pausa_minima = 0.5

# Aire que se deja antes y despues de cada tramo hablado, en segundos.
# Sin esto, cada corte se come el ataque de la primera palabra.
#
# Juani prefiere que corte de menos antes que de mas: un silencio de
# sobra se quita en un segundo, una palabra comida no se recupera sin ir
# a buscarla. El detector reconoce tarde las frases que arrancan suave
# ("Asi que sin mas, empecemos" la empezaba medio segundo tarde), por
# eso el aire de antes es largo. Medido el 02/10/2026 contra las 798
# palabras de un video de 9 minutos: con 0,20 / 0,30 / 0,5 se comia 47,
# con 1,0 / 0,5 / 0,35 se come 5.
margen_antes = 1.0
margen_despues = 0.5

# Tramos mas cortos que esto se tiran: son toses y chasquidos.
tramo_minimo = 0.25

# Cuan exigente es el detector para dar algo por voz, de 0 a 1. Mas
# alto corta mas; mas bajo deja pasar mas ruido. Bajarlo de 0,35 a 0,2
# no recupero ni una palabra mas en la medicion de arriba.
confianza_voz = 0.35

[repeticiones]
# Cuanto se tienen que parecer dos tramos para darlos por la misma
# frase dicha dos veces, de 0 a 1. Por debajo de 0,75 empieza a agrupar
# frases que solo comparten el arranque.
#
# Va laxo a proposito: Juani prefiere ver alguna falsa alarma antes que
# toparse editando con repetidas sin pintar. Medido el 02/10/2026 en
# "video 5 molderia": con 0,75 / 45 s / 6 palabras se pintaron 7 grupos
# y se escaparon al menos 10 repetidas claras (la misma idea dicha con
# otras palabras, o retomada un minuto despues). Con 0,6 / 120 s / 4
# aparecen esas 10 y unas 8 falsas alarmas.
similitud_minima = 0.6

# Cuantos segundos mas adelante se sigue buscando la repeticion. Va en
# segundos y no en cantidad de clips porque trabarse y volver a empezar
# es cosa de tiempo: pasa dentro del medio minuto siguiente, diga uno lo
# que diga en el medio. A veces se retoma mas tarde: "preparo la
# escayola para las dos piezas" volvio a aparecer a los 30 s, y otras
# despues de un rato largo mostrando algo.
ventana_segundos = 120

# Frases mas cortas que esto no se comparan: "si", "claro" o "bueno" se
# repiten todo el tiempo sin ser una toma fallida.
palabras_minimas = 3

# La otra forma de reconocer una repeticion: cuantas palabras seguidas
# iguales alcanzan para darla por buena aunque el resto de la frase
# cambie. Sirve cuando decis lo mismo con dos palabras distintas, o
# cuando el corte parte la frase al medio. Bajarlo marca mas cosas, y a
# partir de 4 empieza a marcar coincidencias de casualidad; se acepta
# por lo dicho arriba.
palabras_seguidas_iguales = 4

[otra voz]
# En los videos de Natalia se oye de fondo a Juani dando indicaciones.
# Donde se le oye se corta aparte, para que cada clip tenga una sola voz
# (si hablan a la vez, el clip cuenta como suyo), y esos clips quedan en
# naranja con un marcador rojo "voz de Juani" (Resolve no tiene rojo para
# los clips). Lo suyo entra siempre al montaje, aunque el detector de voz
# no lo reconozca por estar lejos del microfono. Se distingue por el
# tono: ella anda por los 200-220 Hz y el por los 105, medido el
# 02/10/2026 sobre "para que vean que soy responsable".
#
# Por debajo de este tono, la voz es la de Juani. 0 apaga la deteccion.
# Si quien habla en el video ya tiene la voz grave, no se marca nada.
tono_maximo_hz = 150

# Cuanta voz grave tiene que haber dentro de cada medio segundo para
# darla por buena. Bajarlo marca mas clips y empieza a marcar los
# finales de frase de Natalia, que bajan de tono.
segundos_graves = 0.2

[proxies]
# Alto de las copias livianas, en pixeles. 720 alcanza para editar
# comodo; la calidad final sale del original, que no se toca nunca.
alto = 720

[proyecto]
# Ritmo de la linea de tiempo. 0 quiere decir "el del material", que es
# lo que conviene: si no coinciden, Resolve conforma el video y todos
# los cortes caen corridos.
ritmo = 0
